apiVersion: apps/v1
kind: Deployment
metadata:
  name: remote-pi-relay
  labels:
    app.kubernetes.io/name: remote-pi-relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: remote-pi-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remote-pi-relay
    spec:
      containers:
        - name: remote-pi-relay
          image: jacobmoura7/remote-pi-relay@sha256:7255159041fe32b02a30ba2e09a671fa00783f24c217750cbdf74c5f8b77a7b6
          imagePullPolicy: IfNotPresent
          env:
            - name: REMOTEPI_MESH_DB_PATH
              value: /data/mesh.db
            - name: REMOTEPI_RELAY_PORT
              value: "3000"
            - name: RUST_LOG
              value: info
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: remote-pi-relay-data
