apiVersion: v1
kind: Service
metadata:
  name: mail-smtp
  labels:
    app.kubernetes.io/name: mail-exim
    app.kubernetes.io/part-of: mail
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mail-exim
    app.kubernetes.io/part-of: mail
  ports:
    - name: smtp
      port: 25
      targetPort: smtp
      protocol: TCP
      nodePort: 30025
---
apiVersion: v1
kind: Service
metadata:
  name: mail-submission
  labels:
    app.kubernetes.io/name: mail-exim
    app.kubernetes.io/part-of: mail
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mail-exim
    app.kubernetes.io/part-of: mail
  ports:
    - name: submission
      port: 587
      targetPort: submission
      protocol: TCP
      nodePort: 30587
---
apiVersion: v1
kind: Service
metadata:
  name: mail-imaps
  labels:
    app.kubernetes.io/name: mail-dovecot
    app.kubernetes.io/part-of: mail
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mail-dovecot
    app.kubernetes.io/part-of: mail
  ports:
    - name: imaps
      port: 993
      targetPort: imaps
      protocol: TCP
      nodePort: 30993
