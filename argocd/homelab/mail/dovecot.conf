protocols = imap
listen = *, ::

log_path = /dev/stderr
info_log_path = /dev/stdout
log_timestamp = "%Y-%m-%d %H:%M:%S "
login_greeting = compaan.cloud mail ready.

ssl = required
ssl_min_protocol = TLSv1.2
ssl_cert = </etc/dovecot/tls/tls.crt
ssl_key = </etc/dovecot/tls/tls.key
disable_plaintext_auth = yes
auth_mechanisms = plain login

first_valid_uid = 5000
last_valid_uid = 5000
first_valid_gid = 5000
last_valid_gid = 5000

mail_location = maildir:/var/mail/vmail/%d/%n/Maildir
mail_privileged_group = vmail

passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT /etc/dovecot/auth/passwd-dovecot
}

userdb {
  driver = static
  args = uid=5000 gid=5000 home=/var/mail/vmail/%d/%n
}

service auth {
  user = root
}

service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service imap {
  vsz_limit = 2048 M
}
