apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-rehearsal-data
  namespace: forgejo-rehearsal
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  dataSource:
    name: forgejo-pre-v16-20260912
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
  resources:
    requests:
      storage: 10Gi
