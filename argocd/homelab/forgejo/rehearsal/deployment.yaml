apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-rehearsal
  namespace: forgejo-rehearsal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-rehearsal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-rehearsal
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forgejo
          image: code.forgejo.org/forgejo/forgejo:15.0.5-rootless
          command: ['/bin/sh', '-c', 'exec sleep infinity']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-rehearsal-data
            readOnly: true
