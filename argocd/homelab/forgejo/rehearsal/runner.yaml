apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-rehearsal-runner-config
  namespace: forgejo-rehearsal
data:
  config.yaml: |
    log:
      level: info
      job_level: info
    runner:
      file: /data/.runner
      capacity: 1
      env_file: ''
      timeout: 10m
      shutdown_timeout: 1m
      insecure: false
      fetch_timeout: 5s
      fetch_interval: 2s
      report_interval: 1s
      labels:
        - forgejo-v16-rehearsal-20260912:host
    cache:
      enabled: false
    container:
      docker_host: '-'
      privileged: false
      valid_volumes: []
    host:
      workdir_parent: /data/work
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-rehearsal-runner
  namespace: forgejo-rehearsal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-rehearsal-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-rehearsal-runner
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: register
          image: code.forgejo.org/forgejo/runner:12.7.3
          command:
            - /bin/sh
            - -ec
            - |
              umask 077
              mkdir -p /data/work /tmp/runner
              /bin/forgejo-runner register \
                --config /etc/runner/config.yaml \
                --no-interactive \
                --instance http://forgejo-rehearsal:3000 \
                --token "$(cat /registration/token)" \
                --name forgejo-v16-rehearsal-20260912 \
                --labels forgejo-v16-rehearsal-20260912:host
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/runner
              readOnly: true
            - name: data
              mountPath: /data
            - name: registration
              mountPath: /registration
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:12.7.3
          command:
            - /bin/forgejo-runner
            - --config
            - /etc/runner/config.yaml
            - daemon
          env:
            - name: HOME
              value: /data
            - name: TMPDIR
              value: /tmp/runner
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/runner
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: forgejo-rehearsal-runner-config
        - name: data
          emptyDir: {}
        - name: registration
          secret:
            secretName: forgejo-rehearsal-runner-registration
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forgejo-rehearsal-allow-runner
  namespace: forgejo-rehearsal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: forgejo-rehearsal
  policyTypes: ['Ingress']
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: forgejo-rehearsal-runner
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forgejo-rehearsal-runner-egress
  namespace: forgejo-rehearsal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: forgejo-rehearsal-runner
  policyTypes: ['Egress']
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: forgejo-rehearsal
      ports:
        - protocol: TCP
          port: 3000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
