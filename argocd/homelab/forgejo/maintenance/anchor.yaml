apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-backup-anchor
  namespace: forgejo
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-backup-anchor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-backup-anchor
    spec:
      automountServiceAccountToken: false
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: forgejo
                  app.kubernetes.io/name: forgejo
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anchor
          image: code.forgejo.org/forgejo/forgejo:15.0.5-rootless
          command: ['/bin/sh', '-c', 'exec sleep infinity']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-shared-storage
            readOnly: true
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forgejo-backup-anchor-deny-all
  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: forgejo-backup-anchor
  policyTypes: ['Ingress', 'Egress']
  ingress: []
  egress: []
