apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: forgejo-runner-recreate
  namespace: forgejo
spec:
  admission: true
  background: false
  failurePolicy: Fail
  rules:
    - name: replace-deployment-strategy
      match:
        any:
          - resources:
              kinds:
                - apps/v1/Deployment
              names:
                - forgejo-runner
      mutate:
        patchesJson6902: |-
          - op: add
            path: /spec/strategy
            value:
              type: Recreate
