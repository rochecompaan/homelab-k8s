apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postiz-redis
spec:
  serviceName: postiz-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postiz-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postiz-redis
    spec:
      containers:
        - name: redis
          image: redis:7.2.15-alpine@sha256:05a97a479bc73de66f087dc05b569010772880f778cc8671fa6b8aadee32e5c6
          args:
            - redis-server
            - /usr/local/etc/redis/redis.conf
          ports:
            - name: redis
              containerPort: 6379
          startupProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/redis/redis.conf
              subPath: redis.conf
              readOnly: true
            - name: credentials
              mountPath: /run/secrets
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: postiz-redis
            items:
              - key: redis.conf
                path: redis.conf
        - name: credentials
          secret:
            secretName: postiz-redis
            items:
              - key: users.acl
                path: users.acl
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi
