apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '4'
spec:
  project: default
  source:
    chart: harbor
    repoURL: https://helm.goharbor.io
    targetRevision: 1.18.0
    helm:
      releaseName: harbor
      valuesObject:
        externalURL: https://harbor.compaan
        expose:
          type: clusterIP
          tls:
            enabled: false
          ingress: {}
        portal:
          replicas: 1
        core:
          replicas: 1
          podAnnotations:
            homelab.compaan.cloud/secrets-revision: '2'
          existingSecret: harbor-secrets
          existingXsrfSecret: harbor-secrets
          existingXsrfSecretKey: CSRF_KEY
        jobservice:
          replicas: 1
          podAnnotations:
            homelab.compaan.cloud/secrets-revision: '2'
          existingSecret: harbor-secrets
          existingSecretKey: JOBSERVICE_SECRET
        registry:
          replicas: 1
          podAnnotations:
            homelab.compaan.cloud/secrets-revision: '2'
          existingSecret: harbor-secrets
          existingSecretKey: REGISTRY_HTTP_SECRET
          credentials:
            existingSecret: harbor-secrets
        trivy:
          enabled: true
          replicas: 1
        existingSecretAdminPassword: harbor-secrets
        existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
        existingSecretSecretKey: harbor-secrets
        updateStrategy:
          type: Recreate
        persistence:
          enabled: true
          persistentVolumeClaim:
            registry:
              existingClaim: harbor-registry
            jobservice:
              jobLog:
                storageClass: longhorn
                size: 1Gi
            trivy:
              storageClass: longhorn
              size: 5Gi
        redis:
          type: external
          external:
            addr: harbor-redis-redis-ha-announce-0:26379,harbor-redis-redis-ha-announce-1:26379
            sentinelMasterSet: mymaster
            tlsOptions:
              enable: false
            coreDatabaseIndex: '0'
            jobserviceDatabaseIndex: '1'
            registryDatabaseIndex: '2'
            trivyAdapterIndex: '5'
            username: ''
            password: ''
            existingSecret: ''
        database:
          type: external
          external:
            host: harbor-rw
            port: '5432'
            username: harbor
            coreDatabase: harbor
            existingSecret: harbor-app
            sslmode: disable
        notary:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
